  <style>
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    :root {
      --scale: 1;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: #16213e;
      background-image: linear-gradient(45deg, #1a1a2e, #16213e, #0f3460, #533483);
      background-size: 400% 400%;
      animation: gradientShift 30s ease infinite;
    }

    /* A spoken color keeps its hue and saturation; only its lightness moves, into the
       band where the captions stay readable (4.5:1 or better). Darker colors get white
       text, light ones (yellow, pink, white...) get dark text. */
    body.tint-dark {
      background-image: linear-gradient(45deg,
          oklch(from var(--tint) calc(min(l, 0.52) - 0.15) c h),
          oklch(from var(--tint) calc(min(l, 0.52) - 0.1) c h),
          oklch(from var(--tint) calc(min(l, 0.52) - 0.05) c h),
          oklch(from var(--tint) min(l, 0.52) c h));
    }

    body.tint-light {
      color: #111;
      background-image: linear-gradient(45deg,
          oklch(from var(--tint) calc(max(l, 0.75) - 0.15) c h),
          oklch(from var(--tint) calc(max(l, 0.75) - 0.1) c h),
          oklch(from var(--tint) calc(max(l, 0.75) - 0.05) c h),
          oklch(from var(--tint) max(l, 0.75) c h));
    }

    body.tint-light #captions {
      text-shadow: 0 1px 6px rgba(255, 255, 255, 0.4);
    }

    /* Roll-up captions: the line being spoken sits in the middle of the screen and
       finished lines stack above it. Left-aligned, at most 42 characters a line. */
    #captions {
      position: fixed;
      left: 50%;
      /* Half a line plus the bottom padding, so the bottom line is centered */
      bottom: calc(50vh - 0.9em);
      transform: translateX(-50%);
      /* width is set by measureBudget() */
      /* Room for the text shadow, which the mask would otherwise cut off */
      padding: 0.25em 0.5em;
      /* The current line and the one above it stay solid; older lines fade out */
      mask-image: linear-gradient(to top, #000 2.85em, transparent);
      font-size: calc(var(--scale) * clamp(1.75rem, 5.5vmin, 4.5rem));
      font-weight: 600;
      line-height: 1.3;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
      transition: opacity 0.15s ease;
    }

    /* Fade slowly after a silence, but come back instantly when speech starts again */
    #captions.fading {
      opacity: 0;
      transition: opacity 2s ease;
    }

    .line {
      min-height: 1.3em;
      white-space: nowrap;
    }

    /* Words the recognizer may still change */
    .unstable {
      opacity: 0.7;
    }

    #status {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 16px;
      font-size: 1.25rem;
      text-align: center;
      opacity: 0.75;
    }

    #status[hidden] {
      display: none;
    }

    #flappyCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1000;
      display: none;
      background: #87ceeb;
      cursor: pointer;
    }
  </style>

<body>

  <script>
    const captionsEl = document.getElementById("captions");

    // ========== SETTINGS ==========

    // Every CSS named color. Saying one puts a dark gradient of it behind the captions.

      "ivory", "khaki", "lavender", "lavenderblush", "lawngreen", "lemonchiffon", "lightblue",
      "lightcoral", "lightcyan", "lightgoldenrodyellow", "lightgray", "lightgreen", "lightgrey",
      "lightpink", "lightsalmon", "lightseagreen", "lightskyblue", "lightslategray",
      "lightslategrey", "lightsteelblue", "lightyellow", "lime", "limegreen", "linen", "magenta",
      "maroon", "mediumaquamarine", "mediumblue", "mediumorchid", "mediumpurple",
      "mediumseagreen", "mediumslateblue", "mediumspringgreen", "mediumturquoise",
      "mediumvioletred", "midnightblue", "mintcream", "mistyrose", "moccasin", "navajowhite",
      "navy", "oldlace", "olive", "olivedrab", "orange", "orangered", "orchid", "palegoldenrod",
      "palegreen", "paleturquoise", "palevioletred", "papayawhip", "peachpuff", "peru", "pink",
      "plum", "powderblue", "purple", "rebeccapurple", "red", "rosybrown", "royalblue",
      "saddlebrown", "salmon", "sandybrown", "seagreen", "seashell", "sienna", "silver",
      "skyblue", "slateblue", "slategray", "slategrey", "snow", "springgreen", "steelblue",
      "tan", "teal", "thistle", "tomato", "turquoise", "violet", "wheat", "white", "whitesmoke",
      "yellow", "yellowgreen",
    ]);

    // No color means Echo's own blue gradient from the stylesheet
    const defaults = { color: null, scale: 1 };
    const settings = { ...defaults };

    function loadSettings() {
      try {
        const saved = JSON.parse(localStorage.getItem("echo") || "{}");
        if (colors.has(saved.color)) settings.color = saved.color;
        if (typeof saved.scale === "number") settings.scale = saved.scale;
      } catch (e) {
        // Private windows can block storage; the defaults still work
      }
    }

    // WCAG relative luminance: 0 for black, 1 for white
    function luminance(color) {
      const ctx = document.createElement("canvas").getContext("2d");
      ctx.fillStyle = color; // the canvas hands named colors back as #rrggbb
      const [r, g, b] = [1, 3, 5].map((i) => {
        const v = parseInt(ctx.fillStyle.slice(i, i + 2), 16) / 255;
        return v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4;
      });
      return 0.2126 * r + 0.7152 * g + 0.0722 * b;
    }

    function applySettings() {
      const body = document.body;
      body.classList.remove("tint-dark", "tint-light");
      if (settings.color) {
        body.style.setProperty("--tint", settings.color);
        body.classList.add(luminance(settings.color) > 0.4 ? "tint-light" : "tint-dark");
      }
      document.documentElement.style.setProperty("--scale", settings.scale);
      measureBudget();
      try {
        localStorage.setItem("echo", JSON.stringify(settings));
      } catch (e) { }
    }

    function changeSize(step) {
      // 50% to 200%, the range the FCC asks caption decoders to offer
      settings.scale = Math.min(2, Math.max(0.5, settings.scale + step));
      applySettings();
    }

    // ========== SWEAR FILTER ==========

    const cussWords = new Set([
      // F-word variants
      "fuck",
      "fucked",
      "fucker",
      "fucking",
      "fucks",
      "fuk",
      "fck",
      "motherfucker",
      "motherfucking",

      // S-word variants
      "shit",
      "shitty",
      "shits",
      "shitting",
      "shite",
      "bullshit",
      "horseshit",
      "dipshit",
      "apeshit",
      "batshit",
      "chickenshit",
      "jackshit",
      "dogshit",

      // B-word variants
      "bitch",
      "bitches",
      "bitching",
      "bitchy",
      "biotch",
      "biatch",
      "sonofabitch",

      // Ass variants
      "ass",
      "arse",
      "asshole",
      "arsehole",
      "asswipe",
      "asshat",
      "assfuck",
      "assface",
      "dumbass",
      "fatass",
      "jackass",
      "badass",
      "smartass",
      "wiseass",
      "halfassed",
      "butthole",

      // C-word variants
      "cunt",
      "cunts",
      "cunty",

      // D-word variants
      "damn",
      "damned",
      "dammit",
      "goddamn",
      "goddammit",
      "damnit",
      "dick",
      "dicks",
      "dickhead",
      "dicknose",
      "dickweed",
      "dickface",

      // P-word variants
      "piss",
      "pissed",
      "pissing",
      "pisser",
      "pissoff",
      "pussy",
      "pussies",
      "prick",
      "pricks",

      // Hell variants
      "hell",
      "hella",
      "hellhole",

      // Cock variants
      "cock",
      "cocks",
      "cocksucker",
      "cocksucking",

      // Slurs (racial/homophobic/ableist)
      "nigger",
      "nigga",
      "niggas",
      "faggot",
      "faggots",
      "fag",
      "fags",
      "fagot",
      "dyke",
      "dike",
      "retard",
      "retarded",
      "retards",
      "spic",
      "spics",
      "chink",
      "chinks",
      "gook",
      "kike",
      "wetback",
      "beaner",

      // Sex-related
      "whore",
      "whores",
      "slut",
      "sluts",
      "slutty",
      "skank",
      "skanks",
      "skanky",
      "hoe",
      "hoes",
      "hooker",
      "pimp",
      "pimping",

      // Body parts (vulgar)
      "tits",
      "titty",
      "titties",
      "boob",
      "boobs",
      "booby",
      "boobies",
      "tit",
      "balls",
      "ballsack",
      "nutsack",
      "nuts",

      // Other vulgar terms
      "bastard",
      "bastards",
      "crap",
      "crappy",
      "poop",
      "turd",
      "douche",
      "douchebag",
      "douchecanoe",
      "schmuck",
      "wanker",
      "wank",
      "tosser",
      "bollocks",
      "bloody",
      "bugger",
      "sod",
      "sodding",
      "git",
      "knob",
      "knobhead",
      "twat",
      "twats",
      "prat",
      "pillock",
      "bellend",
      "minge",
      "wazzock",
      "numpty",
      "tosspot",
      "gobshite",
      "shag",
      "shagged",
      "shagging",
      "shat",
      "toss",
      "screw",
      "screwed",
      "screwing",
      "scumbag",
      "mofo",
      "sonovabitch",
      "sob",
      "pecker",
      "weenie",
      "wiener",
      "poon",
      "poontang",
      "cooter",
      "coochie",
      "beotch",
      "ho",

      // Internet/text speak variants
      "wtf",
      "stfu",
      "gtfo",
      "omfg",
      "milf",
      "dilf",
      "pos",
      "af",
      "lmfao",
      "rotfl",

      // Compound/creative
      "shithead",
      "shitface",
      "shitstain",
      "shitbag",
      "shitshow",
      "clusterfuck",
      "fuckface",
      "fuckhead",
      "fuckwit",
      "fucktard",
      "buttfuck",
      "mindfuck",
      "ratbastard",
      "asslicker",
      "assmunch",
      "buttmunch",
      "dickwad",
      "pissbaby",
      "pissant",
      "cumstain",
      "jizz",
      "jizzed",
      "wankstain",
      "fuckboy",
      "fuckboi",
    ]);

    const monkeys = ["🙊", "🙉", "🙈"];

    // The lowercase letters a word starts with, so "Shit's" and "fuck," still match
    function keyOf(word) {
      return ((word || "").toLowerCase().match(/[a-z]+/) || [""])[0];
    }

    // Picks the monkey by word position so it doesn't flicker on every update
    function cleanWord(word, index) {
      return cussWords.has(keyOf(word)) ? monkeys[index % monkeys.length] : word;
    }

    // ========== CAPTION ENGINE ==========
    //
    // Words flow onto the bottom line, which sits in the middle of the screen. When it
    // is full, or a sentence ends, it moves up and the oldest line drops off (roll-up,
    // like live TV), fading out as it nears the top.
    // A line only moves up once every word on it is locked, so the recognizer revising
    // its guess can change the last few words but never a line that has moved up.

    const MAX_LINES = 5; // the line being spoken plus the finished lines above it
    const MAX_CHARS = 42;
    const STABLE_UPDATES = 2; // an interim word locks after surviving this many updates unchanged
    const FADE_AFTER_MS = 4000;
    const CLEAR_AFTER_MS = 6000;

    // Skips the roll-up slide
    const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");

    let finalWords = []; // every final word since the page loaded; never edited
    let interimWords = []; // the recognizer's current guess for what comes after them
    let interimAge = []; // how many updates each interim word has survived unchanged
    let finalResultCount = 0; // results in this recognition session already moved into finalWords

    let closedLines = []; // lines that have moved up, oldest first: { start, words }
    let lineStart = 0; // index of the first word on the bottom line
    let sentenceEnd = 0; // a final result ended here, so the next words want a new line
    let commandIndex = 0; // words before this have been checked for voice commands
    let budget = 0; // pixels one line may use
    const measureCtx = document.createElement("canvas").getContext("2d");

    // Words that start a natural new line, and words that must not end one
    const BREAK_BEFORE = new Set([
      "and", "but", "or", "so", "because", "if", "when", "while", "then", "that", "which",
      "who", "where", "how", "what", "why", "than", "to", "in", "on", "at", "for", "with",
      "from", "of", "about", "into",
    ]);
    const NO_BREAK_AFTER = new Set([
      "a", "an", "the", "my", "your", "his", "her", "its", "our", "their", "this", "these",
      "those", "i", "we", "you", "they", "he", "she", "it", "is", "am", "are", "was", "were",
      "be", "been", "have", "has", "had", "do", "does", "did", "will", "would", "can", "could",
      "should", "not", "very", "really", "to", "and", "or", "but", "of",
    ]);

    function splitWords(text) {
      return text.trim().split(/\s+/).filter(Boolean);
    }

    // Width in pixels, measured in the caption font
    function lineLength(words) {
      return measureCtx.measureText(words.join(" ")).width;
    }

    // Fits as many words as the line holds, and always at least one
    function greedyFit(words, budget) {
      let count = 1;
      while (count < words.length && lineLength(words.slice(0, count + 1)) <= budget) count++;
      return count;
    }

    // Decides where the bottom line ends once its words no longer fit.
    // `words` are the words from the start of the line; joined with spaces
    // they are wider than `budget` pixels. Returns how many of them stay on
    // this line (at least 1); the rest start the next line.
    function findLineBreak(words, budget) {
      const max = greedyFit(words, budget);
      const fullEnough = (count) => lineLength(words.slice(0, count)) >= (budget * 2) / 3;

      // Walk back to a natural break (after punctuation, before "and", "because"...),
      // but not so far that a mostly empty line rolls up and costs reading time
      for (let count = max; count > 1 && fullEnough(count); count--) {
        const last = words[count - 1];
        if (NO_BREAK_AFTER.has(keyOf(last))) continue;
        if (/[,.?!]$/.test(last) || BREAK_BEFORE.has(keyOf(words[count]))) return count;
      }

      // No natural break in reach: at least don't end the line on "the" or "not"
      for (let count = max; count > 1 && fullEnough(count); count--) {
        if (!NO_BREAK_AFTER.has(keyOf(words[count - 1]))) return count;
      }
      return max;
    }

    function closeLine(words, end) {
      closedLines.push({ start: lineStart, words: words.slice(lineStart, end) });
      closedLines = closedLines.slice(-(MAX_LINES - 1));
      lineStart = end;
    }

    function layout(words, locked) {
      let rolled = false;
      while (true) {
        const lineWords = words.slice(lineStart);

        // A new sentence gets a new line, unless the last one was only a word or two
        const sentenceWords = words.slice(lineStart, sentenceEnd);
        if (
          sentenceEnd > lineStart &&
          sentenceEnd <= locked &&
          words.length > sentenceEnd &&
          lineLength(sentenceWords) >= budget / 3 &&
          lineLength(sentenceWords) <= budget
        ) {
          closeLine(words, sentenceEnd);
          rolled = true;
          continue;
        }

        if (lineLength(lineWords) <= budget) return rolled;

        // Pick the break with every word in view, but wait if it would move up a word that may still change
        const count = findLineBreak(lineWords, budget);
        if (lineStart + count > locked) return rolled;
        closeLine(words, lineStart + count);
        rolled = true;
      }
    }

    function lineEl(words, start, stableCount) {
      const el = document.createElement("div");
      el.className = "line";
      const cleaned = words.map((word, i) => cleanWord(word, start + i));
      el.append(cleaned.slice(0, stableCount).join(" "));
      if (stableCount < cleaned.length) {
        const tail = document.createElement("span");
        tail.className = "unstable";
        tail.textContent = (stableCount > 0 ? " " : "") + cleaned.slice(stableCount).join(" ");
        el.append(tail);
      }
      return el;
    }

    function render(words, locked, rolled) {
      const rows = closedLines.map((line) => lineEl(line.words, line.start, line.words.length));
      rows.push(lineEl(words.slice(lineStart), lineStart, Math.max(0, locked - lineStart)));
      while (rows.length < MAX_LINES) rows.unshift(lineEl([], 0, 0));
      captionsEl.replaceChildren(...rows);

      if (rolled && !reducedMotion.matches) {
        captionsEl.animate(
          [{ translate: "0 1.3em" }, { translate: "0 0" }],
          { duration: 180, easing: "ease-out" },
        );
      }
    }

    function lockedCount() {
      let count = 0;
      while (count < interimWords.length && interimAge[count] >= STABLE_UPDATES) count++;
      return finalWords.length + count;
    }

    // `results` is [{ transcript, isFinal }] for the current recognition session
    function handleResults(results) {
      // Finals always come first in the list; everything after them is still a guess
      while (finalResultCount < results.length && results[finalResultCount].isFinal) {
        finalWords.push(...splitWords(results[finalResultCount].transcript));
        finalResultCount++;
        sentenceEnd = finalWords.length;
      }

      const guess = results.slice(finalResultCount).flatMap((r) => splitWords(r.transcript));
      interimAge = guess.map((word, i) => (word === interimWords[i] ? interimAge[i] + 1 : 0));
      interimWords = guess;

      const words = finalWords.concat(interimWords);
      const locked = lockedCount();

      if (words.length > lineStart) statusEl.hidden = true;
      runCommands(words, locked);
      render(words, locked, layout(words, locked));
      resetSilenceTimers();
    }

    let fadeTimer = null;
    let clearTimer = null;

    function resetSilenceTimers() {
      captionsEl.classList.remove("fading");
      clearTimeout(fadeTimer);
      clearTimeout(clearTimer);
      fadeTimer = setTimeout(() => captionsEl.classList.add("fading"), FADE_AFTER_MS);
      clearTimer = setTimeout(clearCaptions, CLEAR_AFTER_MS);
    }

    function clearCaptions() {
      closedLines = [];
      lineStart = finalWords.length + interimWords.length;
      captionsEl.replaceChildren();
      captionsEl.classList.remove("fading");
    }

    // A line gets the width of 42 characters of ordinary text in the caption font,
    // or 90% of the screen if that's narrower, and the caption column is sized to match
    function measureBudget() {
      const style = getComputedStyle(captionsEl);
      measureCtx.font = `${style.fontWeight} ${style.fontSize} ${style.fontFamily}`;
      const sample = "so the quick brown fox jumped over the lazy dog and kept on going";
      const padding = parseFloat(style.paddingLeft) + parseFloat(style.paddingRight);
      budget = Math.min(
        measureCtx.measureText(sample.slice(0, MAX_CHARS)).width,
        document.documentElement.clientWidth * 0.9 - padding,
      );
      captionsEl.style.width = `${budget}px`;
    }

    // ========== VOICE COMMANDS ==========

    // The longest color name ending at this word, so "dark orange" beats "orange"
    // and "dodger blue" finds "dodgerblue"
    function colorEndingAt(words, end) {
      for (let count = Math.min(4, end + 1); count >= 1; count--) {
        const name = words.slice(end - count + 1, end + 1).map(keyOf).join("");
        if (colors.has(name)) return name;
      }
      return null;
    }

    // Each spoken word is checked once, as soon as it locks
    function runCommands(words, locked) {
      for (; commandIndex < locked; commandIndex++) {
        const word = keyOf(words[commandIndex]);
        const color = colorEndingAt(words, commandIndex);

        if (word === "flappybird" || (word === "bird" && keyOf(words[commandIndex - 1]) === "flappy")) {
          startFlappyBird();
        } else if (color) {
          settings.color = color;
          applySettings();
        } else if (word === "bigger") {
          changeSize(0.25);
        } else if (word === "smaller") {
          changeSize(-0.25);
        } else if (word === "normal") {
          settings.scale = defaults.scale;
          applySettings();
        } else if (word === "reset") {
          Object.assign(settings, defaults);
          applySettings();
        }
      }
    }

    // ========== FLAPPY BIRD EASTER EGG ==========

    const flappyCanvas = document.getElementById("flappyCanvas");
    const flappyCtx = flappyCanvas.getContext("2d");
    let flappyGameActive = false;
    let flappyAnimationId = null;

    const flappyGame = {
      bird: { x: 100, y: 0, radius: 15, velocity: 0, gravity: 0.3, jumpStrength: -7 },
      pipes: [],
      score: 0,
      frameCount: 0,
      pipeGap: 250,
      pipeWidth: 60,
      pipeSpeed: 2,
    };

    function resizeFlappyCanvas() {
      flappyCanvas.width = window.innerWidth;
      flappyCanvas.height = window.innerHeight;
    }

    function resetFlappyGame() {
      flappyGame.bird.y = flappyCanvas.height / 2;
      flappyGame.bird.velocity = 0;
      flappyGame.pipes = [];
      flappyGame.score = 0;
      flappyGame.frameCount = 0;
    }

    function drawBird() {
      const { x, y, radius } = flappyGame.bird;
      flappyCtx.fillStyle = "#FFD700";
      flappyCtx.beginPath();
      flappyCtx.arc(x, y, radius, 0, Math.PI * 2);
      flappyCtx.fill();

      flappyCtx.fillStyle = "#000";
      flappyCtx.beginPath();
      flappyCtx.arc(x + 5, y - 3, 3, 0, Math.PI * 2);
      flappyCtx.fill();
    }

    function generatePipe() {
      const minHeight = 50;
      const maxHeight = flappyCanvas.height - flappyGame.pipeGap - 50;
      flappyGame.pipes.push({
        x: flappyCanvas.width,
        topHeight: Math.random() * (maxHeight - minHeight) + minHeight,
        scored: false,
      });
    }

    function drawPipes() {
      const { pipeGap, pipeWidth } = flappyGame;
      flappyCtx.fillStyle = "#228B22";
      flappyCtx.strokeStyle = "#1a6b1a";
      flappyCtx.lineWidth = 3;
      for (const pipe of flappyGame.pipes) {
        const bottomY = pipe.topHeight + pipeGap;
        flappyCtx.fillRect(pipe.x, 0, pipeWidth, pipe.topHeight);
        flappyCtx.fillRect(pipe.x, bottomY, pipeWidth, flappyCanvas.height);
        flappyCtx.strokeRect(pipe.x, 0, pipeWidth, pipe.topHeight);
        flappyCtx.strokeRect(pipe.x, bottomY, pipeWidth, flappyCanvas.height);
      }
    }

    function updatePipes() {
      for (const pipe of flappyGame.pipes) {
        pipe.x -= flappyGame.pipeSpeed;
        if (!pipe.scored && pipe.x + flappyGame.pipeWidth < flappyGame.bird.x) {
          pipe.scored = true;
          flappyGame.score++;
        }
      }
      flappyGame.pipes = flappyGame.pipes.filter((pipe) => pipe.x + flappyGame.pipeWidth >= 0);

      flappyGame.frameCount++;
      if (flappyGame.frameCount % 180 === 0) generatePipe();
    }

    function updateBird() {
      flappyGame.bird.velocity += flappyGame.bird.gravity;
      flappyGame.bird.y += flappyGame.bird.velocity;
    }

    function checkCollision() {
      const bird = flappyGame.bird;
      if (bird.y + bird.radius > flappyCanvas.height || bird.y - bird.radius < 0) return true;

      return flappyGame.pipes.some(
        (pipe) =>
          bird.x + bird.radius > pipe.x &&
          bird.x - bird.radius < pipe.x + flappyGame.pipeWidth &&
          (bird.y - bird.radius < pipe.topHeight ||
            bird.y + bird.radius > pipe.topHeight + flappyGame.pipeGap),
      );
    }

    function drawSky() {
      flappyCtx.fillStyle = "#87CEEB";
      flappyCtx.fillRect(0, 0, flappyCanvas.width, flappyCanvas.height);
    }

    function drawOutlinedText(text, size, y) {
      flappyCtx.font = `bold ${size}px Arial`;
      flappyCtx.textAlign = "center";
      flappyCtx.fillStyle = "#FFF";
      flappyCtx.strokeStyle = "#000";
      flappyCtx.lineWidth = size > 60 ? 4 : 3;
      flappyCtx.strokeText(text, flappyCanvas.width / 2, y);
      flappyCtx.fillText(text, flappyCanvas.width / 2, y);
    }

    function flappyGameLoop() {
      if (!flappyGameActive) return;

      drawSky();
      updateBird();
      updatePipes();
      drawPipes();
      drawBird();
      drawOutlinedText(flappyGame.score, 40, 60);

      if (checkCollision()) {
        endFlappyGame();
        return;
      }

      flappyAnimationId = requestAnimationFrame(flappyGameLoop);
    }

    function birdJump() {
      if (flappyGameActive) flappyGame.bird.velocity = flappyGame.bird.jumpStrength;
    }

    function drawCountdown(count) {
      drawSky();
      flappyCtx.globalAlpha = 0.3;
      drawBird();
      if (flappyGame.pipes.length === 0) generatePipe();
      drawPipes();
      flappyCtx.globalAlpha = 1;

      drawOutlinedText(count, 120, flappyCanvas.height / 2 + 40);
      drawOutlinedText("GET READY!", 36, flappyCanvas.height / 2 - 80);
    }

    function startCountdown() {
      let count = 3;
      (function countdown() {
        if (count > 0) {
          drawCountdown(count--);
          setTimeout(countdown, 1000);
        } else {
          flappyGameActive = true;
          flappyGameLoop();
        }
      })();
    }

    function startFlappyBird() {
      flappyGameActive = false;
      cancelAnimationFrame(flappyAnimationId);
      resizeFlappyCanvas();
      resetFlappyGame();
      flappyCanvas.style.display = "block";
      startCountdown();
    }

    function endFlappyGame() {
      flappyGameActive = false;
      cancelAnimationFrame(flappyAnimationId);
      flappyCanvas.style.display = "none";
    }

    flappyCanvas.addEventListener("click", birdJump);

    document.addEventListener("keydown", (e) => {
      if (e.code === "Space" && flappyCanvas.style.display === "block") {
        e.preventDefault();
        birdJump();
      }
    });

    // ========== SPEECH RECOGNITION ==========

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    function startRecognition() {
      const recognition = new SpeechRecognition();
      recognition.lang = "en-US";
      recognition.continuous = true;
      recognition.interimResults = true;

      let stopped = false;

      recognition.onstart = () => {
        // Each session numbers its results from zero, and unfinished guesses are gone
        finalResultCount = 0;
        interimWords = [];
        interimAge = [];
      };

      recognition.onresult = (event) => {
        handleResults(
          Array.from(event.results, (r) => ({ transcript: r[0].transcript, isFinal: r.isFinal })),
        );
      };

      recognition.onerror = (event) => {
        if (event.error === "not-allowed" || event.error === "service-not-allowed") {
          stopped = true;
          statusEl.textContent = "Echo needs your microphone. Allow it from the address bar, then reload.";
          statusEl.hidden = false;
        } else if (event.error === "audio-capture") {
          stopped = true;
          statusEl.textContent = "No microphone found. Plug one in, then reload.";
          statusEl.hidden = false;
        }
        // Anything else ("no-speech" after a quiet stretch, "network") just restarts
      };

      recognition.onend = () => {
        if (stopped) return;
        setTimeout(() => {
          try {
            recognition.start();
          } catch (e) { }
        }, 250);
      };

      recognition.start();
    }

    // Plays a script through the caption engine the way Chrome would: a growing guess, then a final.
    // Open the page with ?demo to watch the layout without a microphone.
    function runDemo() {
      const script = [
        "hey everyone thanks for coming out tonight",
        "so today I want to talk about how live captions actually work",
        "and why the way the lines move matters more than you would think",
        "the color red changes the background",
      ];
      const results = [];
      let sentence = 0;
      let spoken = 1;

      setInterval(() => {
        const words = splitWords(script[sentence % script.length]);
        const partial = { transcript: words.slice(0, spoken).join(" "), isFinal: spoken > words.length };
        handleResults([...results, partial]);
        if (partial.isFinal) {
          results.push(partial);
          sentence++;
          spoken = 1;
        } else {
          spoken++;
        }
      }, 280);
    }

    loadSettings();
    applySettings();
    resizeFlappyCanvas();
    window.addEventListener("resize", () => {
      measureBudget();
      resizeFlappyCanvas();
    });

    if (new URLSearchParams(location.search).has("demo")) {
      statusEl.hidden = true;
      runDemo();
    } else if (SpeechRecognition) {
      startRecognition();
    } else {
      statusEl.textContent = "Live captions need Chrome, Edge or Safari.";
    }
  </script>
</body>

</html>
