<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- the app's default blue background -->
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1a1a2e"/>
      <stop offset="0.4" stop-color="#16213e"/>
      <stop offset="0.75" stop-color="#0f3460"/>
      <stop offset="1" stop-color="#533483"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-30%" width="110%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- wordmark -->
  <rect x="80" y="72" width="56" height="56" rx="14" fill="#149484"/>
  <text x="108" y="114" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#fff">E</text>
  <text x="156" y="113" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#fff">Echo</text>
  <text x="80" y="190" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" fill="#fff" fill-opacity="0.7">Live captions in your browser. Free, no install.</text>

  <!-- two roll-up caption lines, the newest words still settling -->
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#fff" filter="url(#shadow)">
    <text x="80" y="444">Start talking and your words</text>
    <text x="80" y="520">show up on screen <tspan fill-opacity="0.65">as you say them</tspan></text>
  </g>

  <text x="80" y="590" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" fill="#fff" fill-opacity="0.45">andermiah.github.io/echo</text>
</svg>
